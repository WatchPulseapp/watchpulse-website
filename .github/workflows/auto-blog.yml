name: Auto Blog Publisher

# Publishes one article per run, seven times a day.
#
# Each run produces a single article that is written in English and translated
# into Turkish before it is saved, so one run fills both editions — there is no
# separate Turkish schedule to keep in step.
#
# Seven rather than ten because a writer call costs the 70b about 7,500 tokens
# and Groq's free tier meters that model daily as well as per minute. At ten the
# budget ran out before the day did, and the late slots fell through to the
# weaker model — measured, seven of twenty-four runs in a week published
# nothing. Fewer slots with room for a retry beats more slots that fail.
#
# Spread across Turkish waking hours (UTC+3): 05:11 UTC is 08:11 there and the
# last run lands at 22:11 local, leaving roughly two and a half hours between
# pieces.
#
# The minute is deliberately not :00 — GitHub's scheduler is busiest on the hour
# and delays runs the most there.
#
# Note: GitHub disables scheduled workflows in repositories with no activity for
# 60 days. If commits go quiet, re-enable it from the Actions tab.

on:
  schedule:
    - cron: '11 5,8,10,12,14,17,19 * * *'
  workflow_dispatch:

# One run at a time: two overlapping runs would contend for the same Groq
# per-minute token budget and one of them would come back empty.
concurrency:
  group: auto-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Publish article
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://watchpulseapp.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set."
            exit 1
          fi

          echo "Requesting an article from $SITE_URL"

          # curl treats 429 and 502 as transient, which is exactly what the route
          # returns when Groq refuses on a rate limit. The 90s delay lets Groq's
          # per-minute window reset before the next attempt — without the retries
          # a throttled slot would silently cost that article.
          http_code=$(curl -sS -o response.json -w '%{http_code}' \
            --max-time 150 \
            --retry 3 --retry-delay 90 --retry-connrefused \
            -X POST "$SITE_URL/api/cron/generate-blog" \
            -H "Authorization: Bearer $CRON_SECRET")

          echo "HTTP $http_code"
          cat response.json
          echo

          # Running out of Groq's daily budget is not a broken pipeline.
          #
          # The free tier meters tokens per day as well as per minute, so the
          # last slots of a busy day can find nothing left — the route answers
          # 502 with "rate limited (HTTP 429, 2 tokens left)" and the retries
          # above meet the same wall. That used to end as "All jobs have failed",
          # which reads like an outage and trains you to ignore the mail. It is
          # reported as a skipped slot instead, and only when EVERY failure in
          # the response is a rate limit: an editorial rejection, an empty draft
          # or a crash still fails the run and still sends the mail.
          if [ "$http_code" = "502" ] && grep -qiE '"reason":"[^"]*(rate limit|rate_limit|429)' response.json; then
            echo "::notice::Groq is out of tokens for now — this slot published nothing."
            {
              echo "### Auto Blog Publisher"
              echo ""
              echo "Skipped — the writer was rate limited, so this slot published nothing."
              echo "The next scheduled run picks up where this one stopped."
              echo ""
              echo '```'
              cat response.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$http_code" != "200" ]; then
            echo "::error::Blog generation failed with HTTP $http_code"
            exit 1
          fi

          {
            echo "### Auto Blog Publisher"
            echo ""
            python3 -c "
          import json
          with open('response.json') as f:
              data = json.load(f)
          published = data.get('published', [])
          if data.get('skipped'):
              print('Skipped: ' + data.get('message', 'daily limit reached'))
          elif published:
              print('Published {} of {} today:'.format(
                  data.get('publishedToday'), data.get('dailyLimit')))
              print('')
              for p in published:
                  print('- **{}** ({} words, {}, Turkish: {})'.format(
                      p.get('title'), p.get('words'), p.get('format'),
                      'yes' if p.get('translated') else 'NO'))
          for f_ in data.get('failed', []):
              print('- Failed: {}'.format(f_.get('reason')))
          r = data.get('repaired')
          if r:
              print('- Turkish repair for {}: {}'.format(
                  r.get('slug'), 'done' if r.get('ok') else 'FAILED'))
          "
          } >> "$GITHUB_STEP_SUMMARY"
